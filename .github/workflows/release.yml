name: release

# tag 触发整条发行流水线。桌面包和 APK 共用一条版本流：tag v26.05.2 同时决定
# AUR 的 pkgver 和 APK 的 versionName/versionCode。
#
#   meta ─┬──────────────→ desktop ─────────────┐
#         └→ backend → android → sign ──────────┴→ publish → aur
#
# aur 是用 workflow_call 调的，不是靠 publish-aur.yml 自己的 `release: published`：
# GITHUB_TOKEN 创建的 release 不会触发其他 workflow（GitHub 的防循环规则），
# 那条链会静默断掉——release 发出去了，AUR 却永远不动，而且没有任何报错。
# publish-aur.yml 保留 release 触发器，那条路只服务手工发的 release。
#
# 调试用 workflow_dispatch 且不勾 publish：跑完 meta→sign，产物留在 artifacts，
# 不发 release、不碰 AUR。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，形如 26.05.2（不带 v）'
        required: true
      publish:
        description: '真的发 release 并推 AUR。不勾则只构建'
        type: boolean
        default: false

permissions: {}

concurrency:
  # 同一个 ref 不并发，但绝不取消跑到一半的发行流程
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: 版本号
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.d.outputs.version }}
      tag: ${{ steps.d.outputs.tag }}
      publish: ${{ steps.d.outputs.publish }}
    steps:
      - id: d
        # 经 env 传 ${{ }} 而不是直接插进脚本，免得输入里的引号能拼出命令
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ $EVENT == push ]]; then
              version=${REF_NAME#v}
              publish=true
          else
              version=${IN_VERSION#v}
              publish=$IN_PUBLISH
          fi
          # 三段、每段 1-2 位。这不是洁癖：AnkiDroid 的 versionCode 要塞进 8 位
          # （第 9 位被它自己的 abi 乘数占了），算法见 AnkiDroid/build.gradle 的
          # plusVersion 块。26.05.2 -> 26050200
          if [[ ! $version =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
              echo "::error::版本号要形如 26.05.2，收到 '$version'"
              exit 1
          fi
          {
              echo "version=$version"
              echo "tag=v$version"
              echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "anki-plus **$version**（publish=$publish）" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: 桌面 wheels + tarball
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 腾磁盘
        run: |
          # 本机 anki/out 里 release-lto 的 rust target 1.2 G、node_modules 480 M、
          # 自带 pyenv 670 M、extracted 260 M。runner 预装的这些一样都用不到。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          df -h /

      - name: 装打包工具
        # make-release-tarball.sh 用 bsdtar 拆 wheel 做自检，用 tar --zstd 压缩
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools zstd

      - name: 构建 wheels
        working-directory: 01-Anki-Dev
        env:
          RELEASE: '2'
        run: |
          # 构建 profile 在 configure 阶段就烘进了 out/build.ninja，而 RELEASE 不在
          # ninja 的 RECONFIGURE_KEY 里（见 anki 的 ./ninja）。CI 是干净 checkout，
          # 这个 rm 只是把不变量写明——本机漏了它会静默出 debug 档。
          rm -f out/build.ninja
          ./ninja wheels

      - name: 打 tarball
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          04-Anki-Dev-PKGBUILD/tools/make-release-tarball.sh 01-Anki-Dev "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tarball
          path: dist/*.tar.zst
          if-no-files-found: error

  backend:
    name: rsdroid AAR
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 腾磁盘
        # 注意这里不能删 /usr/local/lib/android：下面要用预装的 SDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 装 NDK
        run: |
          set -euo pipefail
          # 从 libs.versions.toml 读，不在这里抄第二遍。
          # set-android-ndk-home.sh 会再读一次并在缺失时报错。
          ndk=$(sed -n 's/^ndk *= *"\([^"]*\)".*/\1/p' \
                03-Anki-Android-Backend-Dev/gradle/libs.versions.toml)
          [[ -n $ndk ]] || { echo "::error::libs.versions.toml 里读不到 ndk"; exit 1; }
          echo "NDK $ndk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"

      - name: 构建 AAR
        working-directory: 03-Anki-Android-Backend-Dev
        env:
          ANDROID_ARCHS: arm64-v8a
          RELEASE: '1'
          # 跳过宿主机 .so 和 rsdroid-testing.jar：发行只要 AAR，而那次编译的
          # CARGO_TARGET_DIR 是 anki/out/rust，会再堆一整份 target 目录
          SKIP_ROBOLECTRIC: '1'
        run: ./build.sh

      - name: 确认 AAR 里只有该有的 ABI
        run: |
          set -euo pipefail
          aar=03-Anki-Android-Backend-Dev/rsdroid/build/outputs/aar/rsdroid-release.aar
          got=$(unzip -Z1 "$aar" 'jni/*/*.so' | cut -d/ -f2 | sort -u | paste -sd,)
          echo "AAR jniLibs: $got"
          [[ $got == arm64-v8a ]] || {
              echo "::error::AAR 里的 ABI 是 '$got'，期望 arm64-v8a"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: rsdroid-aar
          path: 03-Anki-Android-Backend-Dev/rsdroid/build/outputs/aar/rsdroid-release.aar
          if-no-files-found: error

  android:
    name: APK（暂用 fallback key）
    needs: [meta, backend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: rsdroid-aar
          path: 03-Anki-Android-Backend-Dev/rsdroid/build/outputs/aar/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 指向本地 AAR
        working-directory: 02-AnkiDroid-Dev
        run: |
          # local.properties 不入库（见 workspace README「未入库」一节）。
          # local_backend_path 相对 02 的上一层解析，也就是 workspace 根。
          printf 'local_backend=true\nlocal_backend_path=03-Anki-Android-Backend-Dev\n' \
              > local.properties

      - name: assembleFullRelease
        working-directory: 02-AnkiDroid-Dev
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # full flavor = 无 storage/camera 限制的那个，上游注释写明是发 GitHub/F-Droid 用的。
          # customSuffix 把 applicationId 变成 com.ichi2.anki.plus；manifest 里的
          # provider authority 和自定义权限都是 ${applicationId} 派生的，所以能和
          # 商店版 AnkiDroid 并存。
          ./gradlew :AnkiDroid:assembleFullRelease \
              -PcustomSuffix=plus \
              -PcustomName='Anki+' \
              -PplusVersion="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          # 这个包是用仓库里 tools/fallback-release-keystore.jks 签的，那是一把
          # 公开密钥（DN=CN=Sahil Ahmad），谁都能用。sign job 会整体换掉。
          name: apk-fallback-signed
          path: 02-AnkiDroid-Dev/AnkiDroid/build/outputs/apk/full/release/AnkiDroid-full-arm64-v8a-release.apk
          if-no-files-found: error

  sign:
    name: 用发行 key 重签
    needs: [meta, android]
    runs-on: ubuntu-24.04
    # 密钥绑在这个 environment 上。目前没有 protection rule；想让每次发版都要人
    # 点一下确认，在仓库设置里给它加 required reviewer 即可，workflow 不用改。
    environment: android-signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-fallback-signed

      - name: 重签 + 自检
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          # 刻意只用预装的 build-tools，不引任何第三方 action：这一步是整条流水线
          # 里唯一持有签名密钥的地方，跑的东西越少越好。
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d |
               sort -V | tail -1)
          echo "build-tools: $bt"

          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > ks.jks

          in=AnkiDroid-full-arm64-v8a-release.apk
          out="AnkiPlus-$VERSION-arm64-v8a.apk"

          # apksigner sign 会整体替换签名：旧的 META-INF/*.SF/.RSA 被删掉，
          # 而签名块插在最后一个条目之后、中央目录之前，条目偏移不变，
          # 所以 16 K 页对齐不受影响（本机实测过）。
          "$bt/apksigner" sign \
              --ks ks.jks --ks-key-alias anki-plus \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$out" "$in"
          rm -f ks.jks

          # --- 自检：下面任一条不符就不该发出去 ---
          "$bt/zipalign" -c -P 16 4 "$out"

          # 1. 必须是那把 key 签的。secret 被换掉会在这里断，而不是等用户装不上。
          expect_sha=5ef6ab435473485c77e87cbee6b60300ba328096a35aabe380bdade088cb533d
          got_sha=$("$bt/apksigner" verify --print-certs "$out" |
                    sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ $got_sha == "$expect_sha" ]] || {
              echo "::error::签名证书不对。期望 $expect_sha，实得 '$got_sha'"; exit 1; }

          badging=$("$bt/aapt2" dump badging "$out")
          # 2. applicationId 必须带 .plus。万一 -PcustomSuffix 掉了，这个包会冒充
          #    商店版 AnkiDroid——但签名不同，装不上去，用户看到的是一条莫名的
          #    "应用未安装"。宁可在这里断。
          grep -q "name='com.ichi2.anki.plus'" <<<"$badging" || {
              echo "::error::applicationId 不是 com.ichi2.anki.plus"; exit 1; }
          # 3. versionName 必须等于 tag，否则 Obtainium 装完仍以为有更新，反复提示
          grep -q "versionName='$VERSION'" <<<"$badging" || {
              echo "::error::versionName 不是 $VERSION"; exit 1; }
          # 4. 有 .so 才是能跑的包。AAR 只带 arm64，别的 split 是 18 M 的空壳
          grep -q "native-code: 'arm64-v8a'" <<<"$badging" || {
              echo "::error::APK 里没有 arm64-v8a 的原生库"; exit 1; }

          "$bt/apksigner" verify -v "$out"
          {
              echo '### APK'
              echo '```'
              grep -E "^package|application-label:|native-code" <<<"$badging"
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-signed
          path: AnkiPlus-*.apk
          if-no-files-found: error

  publish:
    name: 发 release
    needs: [meta, desktop, sign]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 只为了在 release notes 里记下三个仓库的确切 commit
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: desktop-tarball
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: apk-signed
          path: dist

      - name: 发 release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist

          # 下面单引号里的反引号是 markdown 的行内代码，不是命令替换
          # shellcheck disable=SC2016
          {
              echo '## 安装'
              echo
              echo '**桌面（Arch）**'
              echo '```'
              echo 'paru -S anki-plus-bin'
              echo '```'
              echo "AUR 会由本次 release 自动更新到 $VERSION。"
              echo
              echo '**Android**'
              echo
              echo '用 [Obtainium](https://github.com/ImranR98/Obtainium) 订阅本仓库，'
              echo '或直接装下面的 APK（arm64-v8a）。'
              echo
              echo '- applicationId `com.ichi2.anki.plus`，和商店版 AnkiDroid 并存，数据互不可见'
              echo '- 签名证书 SHA-256 `5E:F6:AB:43:54:73:48:5C:77:E8:7C:BE:E6:B6:03:00:BA:32:80:96:A3:5A:AB:E3:80:BD:AD:E0:88:CB:53:3D`'
              echo
              echo '## 源码'
              echo
              echo '| 仓库 | commit |'
              echo '|---|---|'
              printf '| workspace | `%s` |\n' "$GITHUB_SHA"
              printf '| [anki-dev](https://github.com/zmr-233/anki-dev) | `%s` |\n' \
                  "$(git -C 01-Anki-Dev rev-parse HEAD)"
              printf '| [ankidroid-backend-dev](https://github.com/zmr-233/ankidroid-backend-dev) | `%s` |\n' \
                  "$(git -C 03-Anki-Android-Backend-Dev rev-parse HEAD)"
              printf '| [ankidroid-dev](https://github.com/zmr-233/ankidroid-dev) | `%s` |\n' \
                  "$(git -C 02-AnkiDroid-Dev rev-parse HEAD)"
          } > notes.md

          # --target 不能省：workflow_dispatch 触发时 tag 还不存在，不指定的话
          # gh 会把它打在默认分支的 HEAD 上，而那未必是这次构建的东西。
          gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "anki-plus $VERSION" \
              --notes-file notes.md \
              dist/*

  aur:
    name: 推 AUR
    needs: [meta, publish]
    # 被调 workflow 的 GITHUB_TOKEN 权限不能超过调用方，而本文件顶上是
    # permissions: {}。publish-aur.yml 里 checkout 要 contents: read，
    # 所以这里必须显式放开这一条。
    permissions:
      contents: read
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ needs.meta.outputs.tag }}
    secrets: inherit
