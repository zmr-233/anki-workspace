name: publish-aur

# release 发布后，把 04-Anki-Dev-PKGBUILD 的 PKGBUILD 推到 AUR。
#
# 这个 job 是整条流水线里唯一持有长期密钥的地方，所以刻意做窄：
#   * 只在 release published / 手工 dispatch / release.yml 调用时跑，
#     绝不在 pull_request 上跑
#   * GITHUB_TOKEN 只有 contents: read —— checkout 需要它，别的都不要
#   * environment: aur —— secret 绑在这个 environment 上，可以在仓库设置里
#     给它加 required reviewer，让每次触碰密钥都要人点一下
#   * known_hosts 硬编码，不用 ssh-keyscan（那是 TOFU，CI 里等于没有校验）
#
# 密钥是 AUR 专用的 ed25519，与本地 main_rsa 分离。它仍然能推该 AUR 账号维护的
# 所有包；要把范围压到单个包，得另开一个 AUR 账号做 co-maintainer。

# 三个入口：
#   workflow_call    ← release.yml 走这条。GITHUB_TOKEN 创建的 release 不会触发
#                      下面那个 release 触发器，所以自动流水线必须显式调用。
#   release          ← 只服务手工发的 release
#   workflow_dispatch← 补推/重推某个已有的 release
on:
  workflow_call:
    inputs:
      tag:
        description: "release tag，例如 v26.05.1"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag，例如 v26.05.1"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: aur
    # makepkg --printsrcinfo 要 pacman 的环境，ubuntu 上没有
    container: archlinux:base-devel

    steps:
      - name: 装依赖
        run: pacman -Syu --noconfirm --needed git openssh python zstd

      - uses: actions/checkout@v4
        with:
          # 只要 04/ 那几个文本文件，submodule 递归下来是几百 MB
          submodules: false

      - name: 生成 PKGBUILD
        working-directory: 04-Anki-Dev-PKGBUILD
        run: python prepare.py --tag "${{ inputs.tag || github.event.release.tag_name }}"

      - name: 配 ssh
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # 绝对路径，不用 ~。容器 job 里 HOME=/github/home，而 OpenSSH 解析 ~ 走的是
          # passwd 里的家目录（getpwuid），root 那是 /root —— shell 的 ~ 和 ssh 的 ~
          # 指向两个地方。写进 ~/.ssh 的东西 ssh 根本不看，表现为
          # "Host key verification failed"（实测踩过）。下面的 GIT_SSH_COMMAND
          # 把这几个路径显式喂给 ssh。
          install -d -m 700 /etc/aur-ssh
          umask 077
          printf '%s\n' "$AUR_SSH_KEY" > /etc/aur-ssh/key
          # 指纹（对照 https://wiki.archlinux.org/title/Arch_User_Repository）：
          #   ED25519  SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   RSA      SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          cat > /etc/aur-ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          EOF

      - name: 生成 .SRCINFO
        working-directory: 04-Anki-Dev-PKGBUILD
        run: |
          # makepkg 拒绝以 root 运行（实测：ERROR: Running makepkg as root is
          # not allowed），而容器里默认就是 root
          useradd -m builder
          chown -R builder .
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          chown root .SRCINFO

      - name: 推 AUR
        working-directory: 04-Anki-Dev-PKGBUILD
        env:
          SKIP_SRCINFO: 1 # 上一步已生成，这里是 root 跑不了 makepkg
          # 全绝对路径。StrictHostKeyChecking=yes 是明写意图：known_hosts 是硬编码的，
          # 认不出来就该失败，不该退回 TOFU。
          GIT_SSH_COMMAND: >-
            ssh -i /etc/aur-ssh/key -o IdentitiesOnly=yes
            -o UserKnownHostsFile=/etc/aur-ssh/known_hosts
            -o StrictHostKeyChecking=yes
        run: |
          git config --global user.name "zmr233"
          git config --global user.email "zmr_233@outlook.com"
          git config --global --add safe.directory '*'
          ./publish_script.sh
